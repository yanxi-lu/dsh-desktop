appId: com.zhangsheng.dsh-desktop
productName: dsh-desktop
directories:
  output: release
# 桌面壳不从任何第三方仓库更新;这里只更新官方 Harness npm 包。
publish: null
files:
  - dist/**
  - src/renderer/**
  - assets/icon.png
  - assets/tray.png
  - package.json
win:
  target: nsis
  # R6: 使用 scripts/gen-icon.ps1 从 2048x2048 源图生成的多尺寸 ICO(16~512),
  # 直接嵌入 exe、NSIS 安装包与桌面/开始菜单快捷方式(含 256/512 大图标)
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 首次安装及后续自动更新后都确保保留桌面一键启动图标
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  runAfterFinish: true
  # 产物名固定为 dsh-desktop-setup-<版本>.exe(electron-builder 26 默认带空格,不符合验收要求)
  artifactName: ${name}-setup-${version}.${ext}
