appId: com.zhangsheng.dsh-desktop
productName: dsh-desktop
directories:
  output: release
files:
  - dist/**
  - src/renderer/**
  - assets/icon.png
  - assets/tray.png
  - package.json
win:
  target: nsis
  # R6: 使用 scripts/gen-icon.ps1 从 2048x2048 源图生成的多尺寸 ICO(16~512),
  # 直接嵌入 exe、NSIS 安装包与桌面/开始菜单快捷方式(含 256/512 大图标)
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: dsh-desktop
  # 产物名固定为 dsh-desktop-setup-<版本>.exe(electron-builder 26 默认带空格,不符合验收要求)
  artifactName: ${name}-setup-${version}.${ext}
