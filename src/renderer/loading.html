<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>正在启动 dsh</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; text-align: center; padding-top: 70px; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 20px;
      border: 4px solid rgba(128,128,128,.3); border-top-color: #0969da;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { display: none; color: #e45a64; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; max-width: 90%; margin: 10px auto 20px; }
    button { padding: 8px 22px; font-size: 15px; cursor: pointer; display: none; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status">正在启动 dsh 服务…</p>
  <p id="error"></p>
  <button id="retry">重试</button>
  <button id="diagnose">打开工作台与诊断</button>
  <script>
    const spinner = document.querySelector('.spinner'), status = document.getElementById('status');
    const error = document.getElementById('error'), retry = document.getElementById('retry'), diagnose = document.getElementById('diagnose');
    function showFailure(message) {
      spinner.style.display = 'none'; status.textContent = '启动失败';
      error.textContent = message; error.style.display = 'block';
      retry.style.display = diagnose.style.display = 'inline-block'; retry.disabled = false;
    }
    window.dshApp.onOperationStatus((event) => {
      if (event.kind === 'error') showFailure(event.message);
      else status.textContent = event.message;
    });
    window.dshApp.onError(showFailure);
    diagnose.onclick = () => window.dshApp.openManagement();
    retry.onclick = async () => {
      spinner.style.display = 'block'; status.textContent = '正在重新启动 dsh 服务…';
      error.style.display = 'none'; retry.disabled = true;
      try { const result = await window.dshApp.retry(); if (!result.ok) showFailure(result.error || '启动失败，请打开工作台与诊断'); }
      catch (failure) { showFailure(failure.message || '重试失败，请打开工作台与诊断'); }
    };
  </script>
</body>
</html>
